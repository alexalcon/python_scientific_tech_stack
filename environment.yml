# -----------------------------------------------
# conda environment of the project
#
# only the packages the project uses directly are listed, and without
# build strings, so conda solves the rest for each operating system
# -----------------------------------------------
name: python_scientific_tech_stack_learning

channels:
  - conda-forge

dependencies:
  # -----------------------------------------------
  # language
  # -----------------------------------------------
  - python=3.12.12

  # -----------------------------------------------
  # interactive environment
  # -----------------------------------------------
  - jupyterlab=4.5.8
  - ipython=9.14.1
  - ipykernel=7.3.0
  - ipywidgets=8.1.8
  - qtconsole=5.7.2

  # -----------------------------------------------
  # libraries
  # -----------------------------------------------
  - numpy=2.4.6
  - matplotlib=3.10.8
  - sympy=1.14.0
  - pillow=12.1.1
  - requests=2.34.2
